name: Daily Catalog Sync & Health Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'data/**'
      - 'documentation/**'
  schedule:
    # Runs every 6 hours, everyday:
    # - 05:35 AM IST (00:05 UTC)
    # - 11:35 AM IST (06:05 UTC)
    # - 05:35 PM IST (12:05 UTC) - captures NSE market close
    # - 11:35 PM IST (18:05 UTC) - captures AMFI daily NAV releases
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Target Directories Exist
        run: mkdir -p data documentation fallback

      - name: Run Master Catalog Pipeline
        run: python orchestrator.py --all

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data/*.sqlite documentation/DATABASE_SCHEMA.md

          if git diff --staged --quiet; then
            echo "No changes detected across databases or schema documentation."
          else
            git commit -m "chore(data): automated daily sync [$(date -u +'%Y-%m-%d %H:%M:%SZ')]"
            git push origin main
          fi

      - name: Publish Master Catalogs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Latest Master Catalogs & Daily Records"
          body: "Automated daily master catalogs with latest market records and NAV history."
          draft: false
          prerelease: false
          files: |
            data/master_equities_etfs.sqlite
            data/master_mutual_funds.sqlite
            data/master_fixed_income.sqlite
            data/master_nps.sqlite
            data/master_commodities.sqlite
            data/master_crypto.sqlite
            data/master_insurers_ulips.sqlite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
