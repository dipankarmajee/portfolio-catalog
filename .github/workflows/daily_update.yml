name: Daily Master Catalog Update

on:
  schedule:
      # 16:30 UTC = 10:00 PM IST (Daily)
          - cron: '30 16 * * *'
            workflow_dispatch:

            permissions:
              contents: write

              jobs:
                build-and-sync:
                    runs-on: ubuntu-latest

                        steps:
                              - name: Checkout Repository
                                      uses: actions/checkout@v4

                                            - name: Setup Python
                                                    uses: actions/setup-python@v5
                                                            with:
                                                                      python-version: '3.11'
                                                                                cache: 'pip'

                                                                                      - name: Install Dependencies
                                                                                              run: |
                                                                                                        pip install -r requirements.txt

                                                                                                              - name: Run Master Ingestion Script
                                                                                                                      run: |
                                                                                                                                python update_master.py

                                                                                                                                      - name: Commit and Push Database Updates
                                                                                                                                              run: |
                                                                                                                                                        git config --global user.name "github-actions[bot]"
                                                                                                                                                                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                            git add data/master_catalog.sqlite
                                                                                                                                                                                      git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated master catalog update [$(date -u +'%Y-%m-%d %H:%M:%S')]" && git push)
                                                                                                                                                                                      