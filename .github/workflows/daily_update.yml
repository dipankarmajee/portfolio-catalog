name: Daily Master Catalog Update

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Dedicated Ingestion Services
        run: |
          mkdir -p data
          python sync_mutual_funds.py
          python sync_equities_etfs.py
          python sync_insurers_ulips.py

      - name: Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: automated catalog sync [$(date -u +'%Y-%m-%d %H:%M:%S')]" && git push)
