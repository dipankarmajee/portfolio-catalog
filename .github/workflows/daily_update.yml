name: Daily Catalog Sync & Health Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'data/**'
      - 'documentation/**'
  schedule:
    # 23:30 IST (11:30 PM IST) Mon-Fri -> 18:00 UTC
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ensure Target Directories Exist
        run: mkdir -p data documentation fallback

      - name: Run Master Catalog Pipeline
        run: python orchestrator.py --all

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data/*.sqlite documentation/DATABASE_SCHEMA.md

          if git diff --staged --quiet; then
            echo "No changes detected across databases or schema documentation."
          else
            git commit -m "chore(data): automated daily sync [$(date -u +'%Y-%m-%d %H:%M:%SZ')]"
            git push origin main
          fi
